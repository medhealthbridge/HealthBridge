<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f766e">
  <title>You're offline · Clinix PH</title>
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    :root { color-scheme: light dark; --bg: #f6f8fa; --card: #fff; --ink: #0b0f17; --muted: #475569; --line: #e2e8f0; --brand: #0f766e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0f17; --card: #121826; --ink: #f1f5f9; --muted: #94a3b8; --line: #1f2a3d; --brand: #14b8a6; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; padding: 28px 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 14px; background: #0f766e; display: grid; place-items: center; }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.01em; }
    p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
    button { min-height: 48px; width: 100%; margin-top: 6px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
    .note { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; }
    [data-online] { display: none; color: var(--brand); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 30 30"><rect x="12" y="4" width="6" height="22" rx="2" fill="#fff"/><rect x="4" y="12" width="22" height="6" rx="2" fill="#fff"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Clinix PH needs a connection to show patient records and save changes. Check your Wi‑Fi or mobile data, then try again.</p>
    <p data-online role="status">Back online. Reloading…</p>
    <button type="button" id="retry">Try again</button>
    <p class="note">For your patients' privacy, records are never stored on this device, so nothing is shown or saved while you're offline.</p>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
    window.addEventListener("online", function () {
      document.querySelector("[data-online]").style.display = "block";
      setTimeout(function () { location.reload(); }, 600);
    });
  </script>
</body>
</html>
